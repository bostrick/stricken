[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "stricken"
dynamic = ["version"]
description = "Financial software"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Bowe Strickland", email = "bowe@yak.net" },
]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "fastcgi[standard]",
    "sqlmodel",
]

[project.urls]
Homepage = "https://github.com/bostrick/stricken"
#Documentation = "https://fastapi.tiangolo.com/"
Repository = "https://github.com/bostrick/stricken"
Issues = "https://github.com/bostrick/stricken/issues"
#Changelog = "https://fastapi.tiangolo.com/release-notes/"

[project.scripts]
fastapi = "fastapi.cli:main"

